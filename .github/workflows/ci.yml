name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint:check

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  test-artifact:
    name: Test deployment artifact
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests against the built zip in the Lambda runtime
        run: npm run test:artifact

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: ymir-image-processing
          path: ymir-image-processing.zip
